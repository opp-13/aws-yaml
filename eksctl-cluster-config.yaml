apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: eks-cluster
  region: ap-northeast-2
  version: "1.32"
  tags:
    Environment: "Testing"
addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: metrics-server
    version: latest   
iam:
  withOIDC: true
vpc:
  id:
  subnets:
    private:
      ap-northeast-2a:
        id: "subnet-0daa11bc099219583"
        # name: 
      ap-northeast-2c:
        id: "subnet-081a34b431a4b614c"
        # name: 
managedNodeGroups:
  - name: mypcng
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    privateNetworking: true
    volumeSize: 20
    ssh:
      allow: true
      publicKeyName: "prod-connect"
    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true
        albIngress: true
    tags:
      eksctl.io/nodegroup-name: "mypcng"