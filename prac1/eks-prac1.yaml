apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: eks-cluster-prac1
  region: ap-northeast-2
  version: "1.32"
  tags:
    Environment: "Testing"
addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: metrics-server
    version: latest   
iam:
  withOIDC: true
vpc:
  id:
  subnets:
    private:
      ap-northeast-2a:
        id: $PRIVATE_SUBNET_1_ID
      ap-northeast-2a-db:
        id: $PRIVATE_DB_SUBNET_1_ID
      ap-northeast-2c:
        id: $PRIVATE_SUBNET_2_ID
      ap-northeast-2c-db:
        id: $PRIVATE_DB_SUBNET_2_ID

managedNodeGroups:
  - name: mypcng
    labels:
      area: web
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    privateNetworking: true
    volumeSize: 20
    ssh:
      allow: true
      publicKeyName: "prod-connect"
    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true
        albIngress: true
    tags:
      eksctl.io/nodegroup-name: "mypcng"
    subnets:
      - ap-northeast-2a
      - ap-northeast-2c

  - name: mydb
    labels:
      area: was
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    privateNetworking: true
    volumeSize: 20
    ssh:
      allow: true
      publicKeyName: "prod-connect"
    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true
        albIngress: true
    tags:
      eksctl.io/nodegroup-name: "mydb"
    subnets:
      - ap-northeast-2a-db
      - ap-northeast-2c-db

