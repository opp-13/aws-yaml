apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: eks-cluster-prac1
  region: ap-northeast-2
  version: "1.32"
  tags:
    Environment: "Testing"
addons:
  - name: vpc-cni
    version: latest
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
  - name: metrics-server
    version: latest   
iam:
  withOIDC: true
vpc:
  id:
  subnets:
    private:
      ap-northeast-2a:
        id: "subnet-02293de5a670688bf"
      ap-northeast-2a-db:
        id: "subnet-0b6e3609dc1a94b6e" 
      ap-northeast-2c:
        id: "subnet-04158f45c7c1db7e8"
      ap-northeast-2c-db:
        id: "subnet-0550896ef26c073ff"

managedNodeGroups:
  - name: mypcng
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    privateNetworking: true
    volumeSize: 20
    ssh:
      allow: true
      publicKeyName: "prod-connect"
    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true
        albIngress: true
    tags:
      eksctl.io/nodegroup-name: "mypcng"
    subnets:
      - ap-northeast-2a
      - ap-northeast-2c

  - name: mydb
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 4
    privateNetworking: true
    volumeSize: 20
    ssh:
      allow: true
      publicKeyName: "prod-connect"
    iam:
      withAddonPolicies:
        autoScaler: true
        ebs: true
        albIngress: true
    tags:
      eksctl.io/nodegroup-name: "mydb"
    subnets:
      - ap-northeast-2a-db
      - ap-northeast-2c-db

