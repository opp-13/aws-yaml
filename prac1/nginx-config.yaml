apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen       80;
        server_name  localhost;

        location = /exam {
            proxy_pass http://internal-k8s-default-tomcatin-997288bf83-417430376.ap-northeast-2.elb.amazonaws.com:80/dbtest.jsp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /exam/ {
            proxy_pass http://internal-k8s-default-tomcatin-997288bf83-417430376.ap-northeast-2.elb.amazonaws.com:80/dbtest.jsp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /h {
          default_type text/plain;
          return 200 "Hostname: $hostname\n";
        }

        location = /ip {
          default_type text/plain;
          return 200 "Client IP: $remote_addr\n";
        }

        location / {
          default_type text/html;
          return 200 'request_method : $request_method | ip_dest: $server_addr\n';
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
          root   html;
        }
      }
    }
